<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Pinkman Manuals</title>
  <meta name="description" content="Пошаговые инструкции: VPN-сервер на 3X-UI и Hysteria2, каскадный VPN, XKeen на роутерах Keenetic">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕶️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    :root {
      --theme-color: #3fb950;
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    body { background: var(--bg); color: var(--text); font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .content { background: var(--bg); }
    .sidebar { background: var(--panel); border-right: 1px solid var(--line); }
    .sidebar > h1 a { color: var(--text); font-weight: 800; }
    .sidebar ul li a { color: var(--muted); }
    .sidebar ul li.active > a { color: var(--theme-color); border-right: 2px solid var(--theme-color); }
    .sidebar-toggle { background: var(--panel); }
    .markdown-section { max-width: 820px; }
    .markdown-section h1 { font-weight: 800; }
    .markdown-section h2 { border-bottom: 1px solid var(--line); padding-bottom: .3em; }
    .markdown-section p, .markdown-section li { color: var(--text); }
    .markdown-section code { background: var(--panel); color: #7ee787; border-radius: 6px; }
    .markdown-section pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .markdown-section pre > code { color: var(--text); }
    .markdown-section img { border-radius: 14px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section tr:nth-child(2n) { background: var(--panel); }
    .markdown-section td, .markdown-section th { border-color: var(--line); }
    .search input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text); }
    .docsify-copy-code-button { background: var(--theme-color) !important; color: #0d1117 !important; border-radius: 6px; }
    .docsify-pagination-container { border-top-color: var(--line); }
  </style>
</head>
<body>
  <div id="app">Загрузка…</div>
  <script>
    window.$docsify = {
      name: 'Pinkman Manuals',
      repo: 'https://github.com/PinkmanXXX/pinkman_manuals',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: 'Поиск', noData: 'Ничего не найдено', depth: 3 },
      copyCode: { buttonText: 'Копировать', successText: 'Скопировано' },
      pagination: { previousText: 'Назад', nextText: 'Дальше', crossChapter: true },
      'flexible-alerts': {
        note: { label: 'Заметка' }, tip: { label: 'Совет' },
        important: { label: 'Важно' }, warning: { label: 'Внимание' }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
